name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
    # uploads to linkedin/ deploy after the import below finishes instead
    paths-ignore: ['linkedin/**']
  # commits made by an action don't trigger other workflows, so deploy when the import finishes
  workflow_run:
    workflows: ['Import LinkedIn']
    types: [completed]
    branches: ['main']
  workflow_dispatch:

jobs:
  build_site:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BLOG_PASSWORD: ${{ secrets.BLOG_PASSWORD }}

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4 